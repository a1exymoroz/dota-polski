name = "dota-polski"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "dota-polski"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[triggers]
crons = ["*/15 * * * *"]

[vars]
DEBT_LIMIT = "60"
CONTACT = "https://github.com/a1exymoroz/dota-polski"

# Secrets (wrangler secret put): API_TOKEN, STEAM_ID, VAPID_PRIVATE
